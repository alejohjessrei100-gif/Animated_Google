// "Why is your lawn torn up?" — a PS1-style low poly explainer.
// Page contract: canvas#c 1080x1920, window.ready, window.drawFrame(t) (pure function of t, seeded random only), window.END.

const look = {
  uSnap: { value: 1.0 }, uSun: { value: new THREE.Vector3(.45, .75, .55).normalize() }, uSunC: { value: new THREE.Vector3(.60, .50, .34) },
  uAmbT: { value: new THREE.Vector3(.74, .72, .80) }, uAmbB: { value: new THREE.Vector3(.50, .46, .56) }, uFog: { value: new THREE.Vector3(.92, .66, .60) }, uFogR: { value: new THREE.Vector2(12, 34) },

// Vertex shader: optional slice-open (rotate each half about a hinge behind the object, toward the camera),
// then snap the clip-space vertex to a grid one low-res pixel wide. vUW carries uv*w so the fragment shader can undo
// the perspective correction (affine mapping, PS1 wobble).
const VS = `
attribute vec3 aB; uniform float uSnap, uSide, uOpen, uShift, uHz; uniform mat4 uRoot, uRootI;
varying vec3 vWP, vRoot, vB, vUW; varying vec2 vUv; varying float vD;
void main() {

// object painted as a dark shell with its triangle edges drawn.

    vertexShader: VS, fragmentShader: FS, side: THREE.DoubleSide,
    uniforms: { ...look, uAff: { value: o.affine ?? 0 }, map: { value: o.map || white }, uTexOwn: { value: o.map ? 1 : 0 }, uColor: { value: new THREE.Vector3(r / 255, g / 255, b / 255) },

const REST = { x: 0, y: 0, z: 0, ry: 0, sq: 1, hip: 0, tw: 0, lean: 0, side: 0, hx: 0, hy: 0, hz: 0, lz: .3, lx: 0, le: -.4, ly: 0, rz_: .3, rx_: 0, re: -.4, ry_: 0, lh: 0, rh: 0, ll: 0, rl: 0, jaw: 0, tail: 0, tl: .5, ear: 0, eL: 0, eR: 0, face: 'open' };

  for (const gq of [grubW, grubL, grubR]) { const inv = gq.root.matrixWorld.clone().invert(); for (const m of gq.mats) { m.uniforms.uRoot.value.copy(gq.root.matrixWorld); m.uniforms.uRootI.value.copy(inv); } }
  shoot(ctx, scene, cam);
  ctx.fillStyle = 'rgba(10,4,24,.055)'; for (let y = 4; y < H; y += 8) ctx.fillRect(0, y, W, 4); // very light scanlines
  overlay(t, openG > .85 && t < T_CLOSE ? t - (T_SLICE + .12) : 0);
}

let auto = true, paused = false, t0 = performance.now(), tp = 0;
window.drawFrame = (t) => { auto = false; drawFrame(t); };
window.END = END; window.WORDS = WORDS.map((w) => [w.s, w.e, w.text]);
window.ready = document.fonts.ready.then(() => { drawFrame(0); });
cv.addEventListener('click', () => { paused = !paused; if (!paused) t0 = performance.now() - tp * 1000; });
const loop = () => { if (!auto) return; if (!paused) { tp = ((performance.now() - t0) / 1000) % END; drawFrame(tp); } requestAnimationFrame(loop); }; requestAnimationFrame(loop);
</script></body></html>
